name: uat-release
run-name: "uat-release • ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

jobs:
  regression:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_test
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
      APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: CI <ci@example.test>

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Run full test suite
        run: npm test -- --run

      - name: Enforce e2e coverage matrix
        run: npm run qa:e2e:coverage

      - name: Check Prisma migration status
        run: npx prisma migrate status

  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: regression
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_e2e_test
      AUTH_SECRET: ci-e2e-auth-secret
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret
      APP_URL: http://127.0.0.1:3100
      AUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_URL: http://127.0.0.1:3100
      PORT: 3100
      STRIPE_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: CI <ci@example.test>
      E2E_TEST_MODE: "1"
      E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Write .env.e2e
        run: |
          cat <<EOF > .env.e2e
          DATABASE_URL=${DATABASE_URL}
          AUTH_SECRET=${AUTH_SECRET}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          APP_URL=${APP_URL}
          AUTH_URL=${AUTH_URL}
          NEXTAUTH_URL=${NEXTAUTH_URL}
          PORT=${PORT}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=${EMAIL_FROM}
          E2E_TEST_MODE=${E2E_TEST_MODE}
          E2E_TEST_SECRET=${E2E_TEST_SECRET}
          EOF

      - name: Reset and seed e2e database
        run: npm run db:e2e:reset

      - name: Run e2e suite
        run: npm run test:e2e:ci

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.ref_name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy_uat:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: e2e
    # UAT deployment must use the uat environment for secrets and approval gating.
    environment: uat
    env:
      TARGET_TAG: ${{ github.ref_name }}
      REMOTE_HOST: ${{ secrets.PROD_SSH_HOST }}
      REMOTE_PORT: ${{ secrets.PROD_SSH_PORT }}
      REMOTE_USER: ${{ secrets.PROD_SSH_USER }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.PROD_CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.PROD_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      BASE_URL: ${{ secrets.PROD_BASE_URL }}
      APP_DIR: ${{ secrets.PROD_APP_DIR }}
      APP_NAME: ${{ secrets.PROD_PM2_APP_NAME }}
      EVIDENCE_ROOT: artifacts/uat-deploy

    steps:
      - name: Check out repository at pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate release tag format
        run: |
          set -euo pipefail
          [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "Invalid release tag: ${TARGET_TAG}" >&2
            exit 1
          }

      - name: Install cloudflared
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          curl -L -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/bin/cloudflared
          /usr/bin/cloudflared version

      - name: Configure SSH with Cloudflare Access
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          cat > "${HOME}/.ssh/config" <<EOF
          Host deploy-target
            HostName ${{ secrets.PROD_SSH_HOST }}
            Port ${{ secrets.PROD_SSH_PORT }}
            User ${{ secrets.PROD_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
          EOF
          chmod 600 "${HOME}/.ssh/config"

      - name: Show release context
        run: |
          set -euo pipefail
          echo "target_tag=${TARGET_TAG}"
          echo "remote_host=${REMOTE_HOST}"
          echo "remote_user=${REMOTE_USER}"
          echo "app_dir=${APP_DIR:-<default from script>}"
          echo "app_name=${APP_NAME:-<default from script>}"
          echo "base_url=${BASE_URL}"

      - name: Test SSH connectivity via Cloudflare Access
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCESS_CLIENT_ID="${CLOUDFLARE_ACCESS_CLIENT_ID}"
          export CLOUDFLARE_ACCESS_CLIENT_SECRET="${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          ssh deploy-target 'hostname && whoami && pm2 status'

      - name: Deploy exact tag to UAT over SSH
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCESS_CLIENT_ID="${CLOUDFLARE_ACCESS_CLIENT_ID}"
          export CLOUDFLARE_ACCESS_CLIENT_SECRET="${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          mkdir -p "${EVIDENCE_ROOT}"
          bash scripts/uat-deploy-tag.sh "${TARGET_TAG}" 2>&1 | tee "${EVIDENCE_ROOT}/deploy-command.log"

      - name: Upload UAT deploy evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uat-deploy-evidence-${{ github.ref_name }}
          path: artifacts/uat-deploy
          if-no-files-found: ignore

  smoke_uat:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: deploy_uat
    env:
      BASE_URL: ${{ secrets.PROD_BASE_URL }}

    steps:
      - name: Check out repository at pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UAT smoke checks
        run: |
          mkdir -p artifacts/uat-smoke
          npm run test:uat:smoke 2>&1 | tee artifacts/uat-smoke/smoke.log

      - name: Upload UAT smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uat-smoke-evidence-${{ github.ref_name }}
          path: artifacts/uat-smoke
          if-no-files-found: ignore

  e2e_uat:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: smoke_uat
    env:
      BASE_URL: ${{ secrets.PROD_BASE_URL }}
      PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
      PROD_E2E_EMAIL: ${{ secrets.PROD_E2E_EMAIL }}
      PROD_E2E_PASSWORD: ${{ secrets.PROD_E2E_PASSWORD }}

    steps:
      - name: Check out repository at pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run deployed UAT release e2e
        run: |
          mkdir -p artifacts/uat-e2e
          npm run test:e2e:uat 2>&1 | tee artifacts/uat-e2e/e2e.log

      - name: Upload UAT e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uat-e2e-artifacts-${{ github.ref_name }}
          path: |
            artifacts/uat-e2e
            playwright-report/
            test-results/
          if-no-files-found: ignore

  k6_smoke_uat:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: e2e_uat
    env:
      BASE_URL: ${{ secrets.PROD_BASE_URL }}
      STAGE_PROFILE: smoke
      K6_SCENARIO_SET: non_booking_smoke
      EVIDENCE_ROOT: artifacts/uat-k6

    steps:
      - name: Check out repository at pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke against deployed UAT
        run: |
          mkdir -p artifacts/uat-k6
          bash scripts/local-uat-run-smoke.sh 2>&1 | tee artifacts/uat-k6/k6-smoke.log

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-k6-artifacts-${{ github.ref_name }}
          path: artifacts/uat-k6
          if-no-files-found: ignore

  zap_uat:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: k6_smoke_uat
    env:
      BASE_URL: ${{ secrets.PROD_BASE_URL }}
      EVIDENCE_ROOT: artifacts/uat-zap
      ZAP_MAX_MINUTES: "5"
      RUN_NORMALIZER: "YES"

    steps:
      - name: Check out repository at pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Ensure ZAP scripts are executable
        run: |
          chmod +x scripts/local-uat-security-baseline.sh scripts/local-uat-security-collect-metrics.sh

      - name: Run OWASP ZAP baseline against deployed UAT
        run: |
          set -euo pipefail
          mkdir -p artifacts/uat-zap
          bash scripts/local-uat-security-baseline.sh 2>&1 | tee artifacts/uat-zap/zap-baseline.log

      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-zap-artifacts-${{ github.ref_name }}
          path: artifacts/uat-zap
          if-no-files-found: ignore
