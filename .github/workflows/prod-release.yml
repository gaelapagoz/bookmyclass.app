name: prod-release
run-name: "prod-release • ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact release tag to deploy to production"
        required: true
        type: string

jobs:
  deploy_prod:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_TAG: ${{ inputs.tag }}
      REMOTE_HOST: ${{ secrets.PROD_SSH_HOST }}
      REMOTE_USER: ${{ secrets.PROD_SSH_USER }}
      BASE_URL: ${{ secrets.PROD_BASE_URL }}
      APP_DIR: ${{ vars.PROD_APP_DIR }}
      APP_NAME: ${{ vars.PROD_PM2_APP_NAME }}
      EVIDENCE_ROOT: artifacts/prod-deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag format
        run: |
          [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "Invalid release tag: ${TARGET_TAG}" >&2
            exit 1
          }

      - name: Verify tag exists in repository
        run: |
          git fetch --tags --force
          git rev-parse "refs/tags/${TARGET_TAG}" >/dev/null

      - name: Configure SSH with strict host key checking
        run: |
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host *
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            Port ${{ secrets.PROD_SSH_PORT }}
          EOF
          chmod 600 "${HOME}/.ssh/config"

      - name: Show production release context
        run: |
          echo "target_tag=${TARGET_TAG}"
          echo "remote_host=${REMOTE_HOST}"
          echo "remote_user=${REMOTE_USER}"
          echo "app_dir=${APP_DIR:-<default from script>}"
          echo "app_name=${APP_NAME:-<default from script>}"
          echo "base_url=${BASE_URL}"

      - name: Deploy exact tag to production over SSH
        run: |
          mkdir -p artifacts/prod-deploy
          bash scripts/prod-deploy-tag.sh "${TARGET_TAG}" 2>&1 | tee artifacts/prod-deploy/deploy-command.log

      - name: Upload production deploy artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-deploy-artifacts-${{ inputs.tag }}
          path: artifacts/prod-deploy
          if-no-files-found: ignore

  smoke_prod:
    runs-on: ubuntu-latest
    needs: deploy_prod
    env:
      BASE_URL: ${{ secrets.PROD_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production smoke checks
        run: |
          mkdir -p artifacts/prod-smoke
          npm run test:uat:smoke 2>&1 | tee artifacts/prod-smoke/smoke.log

      - name: Upload production smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-artifacts-${{ inputs.tag }}
          path: artifacts/prod-smoke
          if-no-files-found: ignore
