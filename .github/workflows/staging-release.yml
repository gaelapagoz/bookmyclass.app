name: Staging Release
run-name: "staging-release - ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

jobs:
  tag_sanity:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_tag_sanity
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d studio_tag_sanity"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TARGET_TAG: ${{ github.ref_name }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_tag_sanity
      AUTH_SECRET: ci-tag-sanity-auth-secret
      NEXTAUTH_SECRET: ci-tag-sanity-nextauth-secret
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: CI <ci@example.test>
      CONTACT_FORM_TO_EMAIL: ci-contact@example.test
      MARKETING_TRACKING_SECRET: ci-marketing-tracking-secret
      CRON_SECRET: ci-cron-secret
      STAGING_BASE_URL: ${{ secrets.UAT_BASE_URL }}
      STAGING_HOMESITE_BASE_URL: ${{ secrets.UAT_HOMESITE_BASE_URL }}
      STAGING_SSH_HOST: ${{ secrets.UAT_SSH_HOST }}
      STAGING_SSH_PORT: ${{ secrets.UAT_SSH_PORT }}
      STAGING_SSH_USER: ${{ secrets.UAT_SSH_USER }}
      STAGING_CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_ID }}
      STAGING_CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      STAGING_APP_DIR: ${{ secrets.UAT_APP_DIR }}
      STAGING_PM2_APP_NAME: ${{ secrets.UAT_PM2_APP_NAME }}
      STAGING_E2E_EMAIL: ${{ secrets.UAT_E2E_EMAIL }}
      STAGING_E2E_PASSWORD: ${{ secrets.UAT_E2E_PASSWORD }}
      ALLOW_STAGING_ON_PRODUCTION_URL: ${{ vars.ALLOW_STAGING_ON_PRODUCTION_URL || '' }}

    steps:
      - name: Check out exact pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate release tag format
        run: |
          set -euo pipefail
          [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "Invalid release tag: ${TARGET_TAG}" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to temporary tag sanity database
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

      - name: Verify temporary database has all migrations applied
        run: npx prisma migrate status

      - name: Validate required UAT compatibility secrets are present
        run: |
          set -euo pipefail
          required=(
            STAGING_BASE_URL
            STAGING_SSH_HOST
            STAGING_SSH_PORT
            STAGING_SSH_USER
            STAGING_CLOUDFLARE_ACCESS_CLIENT_ID
            STAGING_CLOUDFLARE_ACCESS_CLIENT_SECRET
            STAGING_APP_DIR
            STAGING_PM2_APP_NAME
            STAGING_E2E_EMAIL
            STAGING_E2E_PASSWORD
          )

          missing=0
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required value mapped from existing UAT_* secret: ${key}" >&2
              missing=1
            fi
          done

          [[ ${missing} -eq 0 ]]

      - name: Guard against accidental production URL target
        run: |
          set -euo pipefail
          url="${STAGING_BASE_URL%/}"
          host="$(echo "${url}" | sed -E 's#^https?://##' | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"

          if [[ "${host}" == "bookmyclass.app" || "${host}" == "www.bookmyclass.app" ]]; then
            if [[ "${ALLOW_STAGING_ON_PRODUCTION_URL}" != "YES" ]]; then
              echo "Refusing to run staging release against production public URL (${url})." >&2
              echo "Set repository/environment variable ALLOW_STAGING_ON_PRODUCTION_URL=YES only for intentional demo-stage override." >&2
              exit 1
            fi
            echo "Intentional override enabled: staging workflow is allowed to target production public URL (${url})."
          fi

  deploy_staging:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: tag_sanity
    # Environment remains named uat in GitHub for backward compatibility; workflow terminology is staging.
    environment: uat
    env:
      TARGET_TAG: ${{ github.ref_name }}
      REMOTE_HOST: ${{ secrets.UAT_SSH_HOST }}
      REMOTE_PORT: ${{ secrets.UAT_SSH_PORT }}
      REMOTE_USER: ${{ secrets.UAT_SSH_USER }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      STAGING_BASE_URL: ${{ secrets.UAT_BASE_URL }}
      UAT_BASE_URL: ${{ secrets.UAT_BASE_URL }}
      HOMESITE_BASE_URL: ${{ secrets.UAT_HOMESITE_BASE_URL }}
      APP_DIR: ${{ secrets.UAT_APP_DIR }}
      APP_NAME: ${{ secrets.UAT_PM2_APP_NAME }}
      EXPECTED_SHA: ${{ github.sha }}
      EVIDENCE_ROOT: artifacts/staging-deploy
      PROD_DEMO_SSH_HOST: ${{ vars.PROD_DEMO_SSH_HOST || 'ssh-prod.bookmyclass.app' }}

    steps:
      - name: Check out exact pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate release tag format
        run: |
          set -euo pipefail
          [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "Invalid release tag: ${TARGET_TAG}" >&2
            exit 1
          }

      - name: Install cloudflared
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          curl -L -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/bin/cloudflared
          /usr/bin/cloudflared version

      - name: Configure SSH with Cloudflare Access
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${{ secrets.UAT_SSH_PRIVATE_KEY }}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.UAT_SSH_KNOWN_HOSTS }}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          cat > "${HOME}/.ssh/config" <<EOF
          Host deploy-target
            HostName ${{ secrets.UAT_SSH_HOST }}
            Port ${{ secrets.UAT_SSH_PORT }}
            User ${{ secrets.UAT_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 6
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
          EOF
          chmod 600 "${HOME}/.ssh/config"

      - name: Show release context
        run: |
          set -euo pipefail
          echo "target_tag=${TARGET_TAG}"
          echo "remote_host=${REMOTE_HOST}"
          echo "remote_user=${REMOTE_USER}"
          echo "app_dir=${APP_DIR:-<default from script>}"
          echo "app_name=${APP_NAME:-<default from script>}"
          echo "staging_base_url=${STAGING_BASE_URL:-https://demo.bookmyclass.app}"
          echo "homesite_base_url=${HOMESITE_BASE_URL:-https://bookmyclass.app}"
          echo "app_healthcheck_url=${STAGING_BASE_URL:-https://demo.bookmyclass.app}/api/health"
          echo "expected_sha=${EXPECTED_SHA}"

          if [[ "${REMOTE_HOST}" == "${PROD_DEMO_SSH_HOST}" || "${APP_DIR:-}" == "/var/www/bookmyclass" || "${STAGING_BASE_URL}" == "https://bookmyclass.app" || "${STAGING_BASE_URL}" == "https://demo.bookmyclass.app" ]]; then
            echo "::warning::Staging deploy is targeting the production/demo host topology. This is supported for demo-stage use when UAT_* secrets intentionally point there."
          fi

      - name: Test SSH connectivity via Cloudflare Access
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCESS_CLIENT_ID="${CLOUDFLARE_ACCESS_CLIENT_ID}"
          export CLOUDFLARE_ACCESS_CLIENT_SECRET="${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          ssh deploy-target 'hostname && whoami && pm2 status'

      - name: Deploy exact tag to staging over SSH
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCESS_CLIENT_ID="${CLOUDFLARE_ACCESS_CLIENT_ID}"
          export CLOUDFLARE_ACCESS_CLIENT_SECRET="${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          mkdir -p "${EVIDENCE_ROOT}"
          echo "target_tag=${TARGET_TAG}"
          echo "target_env=uat"
          echo "ssh_target_alias=deploy-target"
          echo "app_dir=${APP_DIR:-<default from script>}"
          echo "app_name=${APP_NAME:-<default from script>}"
          TARGET_ENV=uat SSH_HOST="deploy-target" RELEASE_TAG="${TARGET_TAG}" bash scripts/deploy-server-tag.sh 2>&1 | tee "${EVIDENCE_ROOT}/deploy-command.log"

      - name: Collect remote staging deploy logs on failure
        if: failure()
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCESS_CLIENT_ID="${CLOUDFLARE_ACCESS_CLIENT_ID}"
          export CLOUDFLARE_ACCESS_CLIENT_SECRET="${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          mkdir -p "${EVIDENCE_ROOT}/remote"
          ssh deploy-target 'set -euo pipefail
            latest="$(find /tmp -maxdepth 1 -type d -name "uat-deploy-*" -printf "%T@ %p\n" 2>/dev/null | sort -nr | head -n 1 | cut -d" " -f2- || true)"
            if [[ -z "$latest" ]]; then
              latest="$(find /tmp -maxdepth 1 -type d -name "*-deploy-*" -printf "%T@ %p\n" 2>/dev/null | sort -nr | head -n 1 | cut -d" " -f2- || true)"
            fi
            if [[ -z "$latest" ]]; then
              echo "[warn] no /tmp/*-deploy-* directory found"
              exit 0
            fi
            echo "latest_remote_deploy_dir=$latest"
            find /tmp -maxdepth 2 -path "/tmp/*-deploy-*/deploy.log" -printf "%p\n" | sort
            cat "$latest/deploy.log"
          ' 2>&1 | tee "${EVIDENCE_ROOT}/remote/latest-remote-deploy.log"

      - name: Upload staging deploy evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-evidence-${{ github.ref_name }}
          path: artifacts/staging-deploy
          if-no-files-found: ignore

  post_deploy_health_staging:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: deploy_staging
    environment: uat
    env:
      BASE_URL: ${{ secrets.UAT_BASE_URL }}
      REMOTE_HOST: ${{ secrets.UAT_SSH_HOST }}
      REMOTE_PORT: ${{ secrets.UAT_SSH_PORT }}
      REMOTE_USER: ${{ secrets.UAT_SSH_USER }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      APP_NAME: ${{ secrets.UAT_PM2_APP_NAME }}
      EVIDENCE_ROOT: artifacts/staging-post-deploy-health
      HEALTH_ATTEMPTS: "12"
      HEALTH_DELAY_SECONDS: "10"

    steps:
      - name: Install cloudflared
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          curl -L -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/bin/cloudflared
          /usr/bin/cloudflared version

      - name: Configure SSH with Cloudflare Access
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${{ secrets.UAT_SSH_PRIVATE_KEY }}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.UAT_SSH_KNOWN_HOSTS }}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          cat > "${HOME}/.ssh/config" <<EOF
          Host deploy-target
            HostName ${{ secrets.UAT_SSH_HOST }}
            Port ${{ secrets.UAT_SSH_PORT }}
            User ${{ secrets.UAT_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 6
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
          EOF
          chmod 600 "${HOME}/.ssh/config"

      - name: Public health gate and classification diagnostics
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}"
          LOG_FILE="${EVIDENCE_ROOT}/post-deploy-health.log"
          : > "${LOG_FILE}"
          public_url="${BASE_URL%/}/api/health"

          echo "public_health_url=${public_url}" | tee -a "${LOG_FILE}"
          public_ok=0
          for attempt in $(seq 1 "${HEALTH_ATTEMPTS}"); do
            echo "attempt=${attempt}/${HEALTH_ATTEMPTS} url=${public_url}" | tee -a "${LOG_FILE}"
            http_code="$(curl -sS -L --connect-timeout 10 --max-time 20 -o "${EVIDENCE_ROOT}/public-health-body.txt" -w "%{http_code}" "${public_url}" || true)"
            echo "public_health_code=${http_code}" | tee -a "${LOG_FILE}"
            echo "--- public health body ---" | tee -a "${LOG_FILE}"
            cat "${EVIDENCE_ROOT}/public-health-body.txt" | tee -a "${LOG_FILE}" || true
            echo "--- end public health body ---" | tee -a "${LOG_FILE}"
            if [[ "${http_code}" == "200" ]]; then
              public_ok=1
              break
            fi
            sleep "${HEALTH_DELAY_SECONDS}"
          done

          if [[ "${public_ok}" -eq 1 ]]; then
            echo "[PASS] post_deploy_health_staging public health returned 200" | tee -a "${LOG_FILE}"
            exit 0
          fi

          export CLOUDFLARE_ACCESS_CLIENT_ID="${CLOUDFLARE_ACCESS_CLIENT_ID}"
          export CLOUDFLARE_ACCESS_CLIENT_SECRET="${CLOUDFLARE_ACCESS_CLIENT_SECRET}"

          if ! ssh deploy-target 'echo "ssh_ok=1"'; then
            echo "[CASE E] SSH connectivity to deploy-target failed" | tee -a "${LOG_FILE}"
            exit 1
          fi

          ssh deploy-target "set -euo pipefail
            APP_NAME='${APP_NAME}'
            echo '--- remote diagnostics start ---'
            echo \"hostname=\$(hostname)\"
            echo \"whoami=\$(whoami)\"
            date -u
            echo '[F] resource pressure snapshot'
            uptime || true
            free -h || true
            df -h || true
            ps -eo pid,ppid,stat,pcpu,pmem,etime,cmd --sort=-pcpu | head -n 40 || true
            ps -eo pid,ppid,stat,pcpu,pmem,etime,cmd | egrep 'next build|next-swc|tsc|turbo|npm|prisma|node' | grep -v egrep || true
            echo '[B/C/D] process and local health snapshot'
            pm2 status || true
            pm2 describe \"\$APP_NAME\" || true
            pm2 logs \"\$APP_NAME\" --lines 150 --nostream || true
            echo '--- local app probes ---'
            curl -i -sS --max-time 20 http://127.0.0.1:3000/api/health || true
            curl -i -sS --max-time 20 http://127.0.0.1:3000/ || true
            echo '--- port listeners ---'
            ss -ltnp || true
            ss -ltnp | grep ':3000' || true
            echo '[A] nginx and proxy snapshot'
            systemctl is-active nginx || true
            nginx -t || true
            tail -n 100 /var/log/nginx/error.log || true
            tail -n 100 /var/log/nginx/access.log || true
            echo '--- remote diagnostics end ---'
          " 2>&1 | tee -a "${LOG_FILE}"

          echo "[FAIL] public health never reached 200; see diagnostics log for case classification evidence." | tee -a "${LOG_FILE}"
          exit 1

      - name: Upload post-deploy health diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-post-deploy-health-${{ github.ref_name }}
          path: artifacts/staging-post-deploy-health
          if-no-files-found: ignore

  smoke_staging:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: post_deploy_health_staging
    env:
      STAGING_BASE_URL: ${{ secrets.UAT_BASE_URL }}
      BASE_URL: ${{ secrets.UAT_BASE_URL }}

    steps:
      - name: Check out exact pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run staging smoke checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-smoke
          npm run test:staging:smoke 2>&1 | tee artifacts/staging-smoke/smoke.log

      - name: Upload staging smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-evidence-${{ github.ref_name }}
          path: artifacts/staging-smoke
          if-no-files-found: ignore

  e2e_staging:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: smoke_staging
    env:
      BASE_URL: ${{ secrets.UAT_BASE_URL }}
      UAT_BASE_URL: ${{ secrets.UAT_BASE_URL }}
      STAGING_BASE_URL: ${{ secrets.UAT_BASE_URL }}
      UAT_E2E_EMAIL: ${{ secrets.UAT_E2E_EMAIL }}
      UAT_E2E_PASSWORD: ${{ secrets.UAT_E2E_PASSWORD }}
      STAGING_E2E_EMAIL: ${{ secrets.UAT_E2E_EMAIL }}
      STAGING_E2E_PASSWORD: ${{ secrets.UAT_E2E_PASSWORD }}

    steps:
      - name: Check out exact pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run deployed staging release e2e
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-e2e
          npm run test:e2e:staging 2>&1 | tee artifacts/staging-e2e/e2e.log

      - name: Upload staging e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-artifacts-${{ github.ref_name }}
          path: |
            artifacts/staging-e2e
            playwright-report/
            test-results/
          if-no-files-found: ignore

  k6_smoke_staging:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: prepare_k6_staging_data
    env:
      BASE_URL: ${{ secrets.UAT_BASE_URL }}
      STAGE_PROFILE: smoke
      K6_SCENARIO_SET: non_booking_smoke
      EVIDENCE_ROOT: artifacts/staging-k6

    steps:
      - name: Check out exact pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke against deployed staging
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-k6
          bash scripts/performance-server-run-smoke.sh 2>&1 | tee artifacts/staging-k6/k6-smoke.log

      - name: Upload staging k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-k6-artifacts-${{ github.ref_name }}
          path: artifacts/staging-k6
          if-no-files-found: ignore

  prepare_k6_staging_data:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: e2e_staging
    environment: uat
    env:
      REMOTE_HOST: ${{ secrets.UAT_SSH_HOST }}
      REMOTE_PORT: ${{ secrets.UAT_SSH_PORT }}
      REMOTE_USER: ${{ secrets.UAT_SSH_USER }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.UAT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      APP_DIR: ${{ secrets.UAT_APP_DIR }}
      RUN_STAGING_K6_SEED: ${{ vars.RUN_STAGING_K6_SEED || 'NO' }}
      K6_SCENARIO_SET: non_booking_smoke
      EVIDENCE_ROOT: artifacts/staging-k6-seed

    steps:
      - name: Install cloudflared
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          curl -L -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/bin/cloudflared
          /usr/bin/cloudflared version

      - name: Configure SSH with Cloudflare Access
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${{ secrets.UAT_SSH_PRIVATE_KEY }}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.UAT_SSH_KNOWN_HOSTS }}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          cat > "${HOME}/.ssh/config" <<EOF
          Host deploy-target
            HostName ${{ secrets.UAT_SSH_HOST }}
            Port ${{ secrets.UAT_SSH_PORT }}
            User ${{ secrets.UAT_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 6
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
          EOF
          chmod 600 "${HOME}/.ssh/config"

      - name: Prepare staging k6 data (guarded)
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}"
          LOG_FILE="${EVIDENCE_ROOT}/prepare-k6-staging-data.log"
          : > "${LOG_FILE}"
          echo "k6_scenario_set=${K6_SCENARIO_SET}" | tee -a "${LOG_FILE}"
          echo "run_staging_k6_seed=${RUN_STAGING_K6_SEED}" | tee -a "${LOG_FILE}"
          echo "ssh_target_alias=deploy-target" | tee -a "${LOG_FILE}"

          case "${K6_SCENARIO_SET}" in
            non_booking_smoke|full_smoke|booking_only_smoke)
              scenario_requires_seed="yes"
              ;;
            *)
              scenario_requires_seed="unknown"
              ;;
          esac

          if [[ "${scenario_requires_seed}" == "unknown" ]]; then
            echo "[FAIL] Unsupported/unknown K6_SCENARIO_SET=${K6_SCENARIO_SET} for seed policy." | tee -a "${LOG_FILE}"
            exit 1
          fi

          if [[ "${RUN_STAGING_K6_SEED}" != "YES" ]]; then
            echo "[FAIL] Scenario set ${K6_SCENARIO_SET} requires seeded k6 cohorts/users. Set RUN_STAGING_K6_SEED=YES to allow staging DB seed preparation." | tee -a "${LOG_FILE}"
            exit 1
          fi

          export CLOUDFLARE_ACCESS_CLIENT_ID="${CLOUDFLARE_ACCESS_CLIENT_ID}"
          export CLOUDFLARE_ACCESS_CLIENT_SECRET="${CLOUDFLARE_ACCESS_CLIENT_SECRET}"

          ssh deploy-target "set -euo pipefail
            cd '${APP_DIR:-/var/www/bookmyclass}'
            set -a
            . ./.env
            set +a
            npm run db:seed:uat-performance
            UAT_K6_SEED=1 npm run db:seed:server:k6
          " 2>&1 | tee -a "${LOG_FILE}"

      - name: Upload staging k6 seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-k6-seed-evidence-${{ github.ref_name }}
          path: artifacts/staging-k6-seed
          if-no-files-found: ignore

  zap_staging:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: k6_smoke_staging
    env:
      BASE_URL: ${{ secrets.UAT_BASE_URL }}
      EVIDENCE_ROOT: artifacts/staging-zap
      ZAP_MAX_MINUTES: "5"
      RUN_NORMALIZER: "YES"

    steps:
      - name: Check out exact pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Ensure ZAP scripts are executable
        run: |
          chmod +x scripts/security-server-run-baseline.sh scripts/security-server-collect-metrics.sh

      - name: Run OWASP ZAP baseline against deployed staging
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-zap
          bash scripts/security-server-run-baseline.sh 2>&1 | tee artifacts/staging-zap/zap-baseline.log

      - name: Upload staging ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-zap-artifacts-${{ github.ref_name }}
          path: artifacts/staging-zap
          if-no-files-found: ignore
